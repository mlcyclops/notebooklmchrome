<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img" aria-label="Atlas - Research and Podcast Studio concept built on the companion server">
  <defs>
    <linearGradient id="bgv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4c1d95"/><stop offset="0.5" stop-color="#7c3aed"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ede9fe"/><stop offset="1" stop-color="#fbcfe8"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#1e1b4b" flood-opacity="0.5"/></filter>
  </defs>

  <rect x="0" y="0" width="1440" height="900" rx="26" fill="#0e0c18"/>

  <!-- window -->
  <g filter="url(#sh)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <rect x="24" y="24" width="1392" height="852" rx="20" fill="#14121f"/>

    <!-- top bar -->
    <rect x="24" y="24" width="1392" height="66" rx="20" fill="#1b1830"/>
    <rect x="24" y="70" width="1392" height="20" fill="#1b1830"/>
    <!-- logo -->
    <g transform="translate(48,40)">
      <circle cx="16" cy="17" r="6" fill="#a78bfa"/><circle cx="36" cy="9" r="4" fill="#c4b5fd"/><circle cx="38" cy="27" r="4" fill="#f472b6"/>
      <g stroke="#7c3aed" stroke-width="2"><line x1="16" y1="17" x2="36" y2="9"/><line x1="16" y1="17" x2="38" y2="27"/></g>
    </g>
    <text x="108" y="58" fill="#f3f0ff" font-size="24" font-weight="800">Atlas</text>
    <text x="174" y="58" fill="#8b86a6" font-size="15" font-weight="500">Research &amp; Podcast Studio</text>
    <!-- tabs -->
    <g font-size="16" font-weight="600">
      <text x="560" y="62" fill="#8b86a6">Graph</text>
      <text x="648" y="62" fill="#f3f0ff">Podcasts</text>
      <rect x="640" y="74" width="74" height="3" rx="1.5" fill="#a78bfa"/>
      <text x="760" y="62" fill="#8b86a6">Study</text>
      <text x="838" y="62" fill="#8b86a6">Automations</text>
    </g>
    <!-- connected status -->
    <g transform="translate(1180,38)">
      <rect x="0" y="0" width="206" height="32" rx="16" fill="#11281f"/>
      <circle cx="22" cy="16" r="5" fill="#34d399"/>
      <text x="38" y="21" fill="#6ee7b7" font-size="14.5" font-weight="600">Connected · localhost:3000</text>
    </g>

    <!-- ===== left rail ===== -->
    <text x="48" y="124" fill="#6f6a88" font-size="13" font-weight="700" letter-spacing="1">LIBRARY</text>
    <g font-size="15.5">
      <rect x="40" y="138" width="232" height="42" rx="10" fill="#241f3d"/>
      <text x="58" y="164" font-size="17">📁</text><text x="86" y="164" fill="#f3f0ff" font-weight="600">Compliance</text><text x="252" y="164" fill="#8b86a6" font-size="13" text-anchor="end">6</text>
      <text x="58" y="208" font-size="17">📁</text><text x="86" y="208" fill="#c8c4dd" font-weight="500">Cloud &amp; Dev</text><text x="252" y="208" fill="#8b86a6" font-size="13" text-anchor="end">9</text>
      <text x="58" y="250" font-size="17">📁</text><text x="86" y="250" fill="#c8c4dd" font-weight="500">AI Agents</text><text x="252" y="250" fill="#8b86a6" font-size="13" text-anchor="end">5</text>
      <text x="58" y="292" font-size="17">📁</text><text x="86" y="292" fill="#c8c4dd" font-weight="500">Research</text><text x="252" y="292" fill="#8b86a6" font-size="13" text-anchor="end">12</text>
    </g>
    <line x1="40" y1="320" x2="272" y2="320" stroke="#2a2542"/>
    <text x="48" y="356" fill="#6f6a88" font-size="13" font-weight="700" letter-spacing="1">KNOWLEDGE GRAPH</text>
    <!-- mini graph -->
    <g transform="translate(40,372)">
      <g stroke="#3b3460" stroke-width="2"><line x1="116" y1="56" x2="50" y2="110"/><line x1="116" y1="56" x2="120" y2="124"/><line x1="116" y1="56" x2="186" y2="108"/><line x1="50" y1="110" x2="120" y2="124"/></g>
      <circle cx="116" cy="56" r="13" fill="url(#bgv)"/>
      <circle cx="50" cy="110" r="9" fill="#c4b5fd"/><circle cx="120" cy="124" r="9" fill="#f472b6"/><circle cx="186" cy="108" r="9" fill="#a78bfa"/>
    </g>
    <g transform="translate(40,520)"><rect width="232" height="44" rx="10" fill="#241f3d" stroke="#3b3460"/><text x="116" y="29" fill="#c4b5fd" font-size="15" font-weight="700" text-anchor="middle">+ New automation</text></g>

    <line x1="296" y1="106" x2="296" y2="852" stroke="#241f3d"/>

    <!-- ===== center: podcast studio ===== -->
    <text x="328" y="138" fill="#f3f0ff" font-size="26" font-weight="800">Podcast Studio</text>
    <text x="328" y="166" fill="#8b86a6" font-size="16">Turn any folder into a narrated, multi-episode series, built from your notebooks.</text>

    <!-- featured episode -->
    <rect x="328" y="190" width="700" height="220" rx="16" fill="#1d1a30"/>
    <rect x="352" y="214" width="172" height="172" rx="14" fill="url(#cover)"/>
    <g transform="translate(372,300)" stroke="#ffffff" stroke-opacity="0.9" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="6" x2="0" y2="-6"/><line x1="12" y1="14" x2="12" y2="-14"/><line x1="24" y1="22" x2="24" y2="-22"/><line x1="36" y1="12" x2="36" y2="-12"/><line x1="48" y1="20" x2="48" y2="-20"/><line x1="60" y1="8" x2="60" y2="-8"/><line x1="72" y1="16" x2="72" y2="-16"/><line x1="84" y1="6" x2="84" y2="-6"/><line x1="96" y1="12" x2="96" y2="-12"/><line x1="108" y1="4" x2="108" y2="-4"/><line x1="120" y1="10" x2="120" y2="-10"/>
    </g>
    <g transform="translate(548,222)">
      <rect x="0" y="0" width="210" height="26" rx="13" fill="#2c2547"/><text x="105" y="18" fill="#c4b5fd" font-size="13.5" font-weight="600" text-anchor="middle">from Compliance · 6 notebooks</text>
      <text x="0" y="64" fill="#f3f0ff" font-size="23" font-weight="800">Compliance, Explained</text>
      <text x="0" y="92" fill="#a39ec0" font-size="16">Episode 3 · Audit trails &amp; evidence · 18 min</text>
      <g transform="translate(0,118)"><rect width="150" height="44" rx="22" fill="url(#bgv)"/><path d="M58 14 l20 8 -20 8 z" fill="#fff"/><text x="96" y="29" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">Play</text></g>
      <g transform="translate(166,118)"><rect width="160" height="44" rx="22" fill="none" stroke="#4b4470"/><text x="80" y="29" fill="#c8c4dd" font-size="15" font-weight="600" text-anchor="middle">↻ Regenerate</text></g>
    </g>

    <!-- queue -->
    <text x="328" y="448" fill="#f3f0ff" font-size="18" font-weight="700">Episode queue</text>
    <g font-size="15.5">
      <rect x="328" y="464" width="700" height="56" rx="12" fill="#1d1a30"/>
      <text x="352" y="498" fill="#f3f0ff" font-weight="600">Ep. 4 — Data residency &amp; sovereignty</text>
      <g transform="translate(852,484)"><rect width="152" height="26" rx="13" fill="#11281f"/><text x="76" y="18" fill="#6ee7b7" font-size="13" font-weight="600" text-anchor="middle">Ready</text></g>

      <rect x="328" y="528" width="700" height="56" rx="12" fill="#1d1a30"/>
      <text x="352" y="554" fill="#f3f0ff" font-weight="600">Ep. 5 — Incident response playbooks</text>
      <rect x="352" y="566" width="480" height="6" rx="3" fill="#2c2547"/><rect x="352" y="566" width="307" height="6" rx="3" fill="#a78bfa"/>
      <g transform="translate(852,540)"><rect width="152" height="26" rx="13" fill="#2a2340"/><text x="76" y="18" fill="#c4b5fd" font-size="13" font-weight="600" text-anchor="middle">Generating · 64%</text></g>

      <rect x="328" y="592" width="700" height="56" rx="12" fill="#1d1a30"/>
      <text x="352" y="626" fill="#cdc9e0" font-weight="600">Ep. 6 — Vendor risk &amp; SOC 2</text>
      <g transform="translate(852,612)"><rect width="152" height="26" rx="13" fill="#241f33"/><text x="76" y="18" fill="#8b86a6" font-size="13" font-weight="600" text-anchor="middle">Queued</text></g>
    </g>

    <!-- automation note -->
    <g transform="translate(328,672)">
      <rect width="700" height="60" rx="12" fill="#191630" stroke="#2c2547"/>
      <text x="22" y="28" font-size="16">⚙️</text>
      <text x="50" y="28" fill="#c8c4dd" font-size="15">Automation: <tspan fill="#a78bfa" font-weight="700">When a notebook is added to "Compliance" → draft the next episode.</tspan></text>
      <text x="50" y="48" fill="#6f6a88" font-size="13.5">Powered by POST /api/notebooks/:id/generate-product over the companion server.</text>
    </g>

    <line x1="1056" y1="106" x2="1056" y2="852" stroke="#241f33"/>

    <!-- ===== right: study pack ===== -->
    <text x="1084" y="138" fill="#f3f0ff" font-size="22" font-weight="800">Study Pack</text>
    <text x="1084" y="164" fill="#8b86a6" font-size="14.5">Generated from the same folder.</text>

    <!-- study guide preview -->
    <rect x="1084" y="184" width="304" height="172" rx="14" fill="#ffffff"/>
    <rect x="1084" y="184" width="304" height="44" rx="14" fill="url(#page)"/>
    <text x="1104" y="212" fill="#4c1d95" font-size="15" font-weight="800">Study Guide · Compliance</text>
    <g fill="#cbb9f0"><rect x="1104" y="244" width="180" height="9" rx="4.5"/><rect x="1104" y="262" width="264" height="9" rx="4.5" fill="#e6def8"/><rect x="1104" y="280" width="240" height="9" rx="4.5" fill="#e6def8"/><rect x="1104" y="298" width="264" height="9" rx="4.5" fill="#e6def8"/><rect x="1104" y="316" width="150" height="9" rx="4.5" fill="#e6def8"/></g>

    <!-- stat chips -->
    <g font-size="14.5" font-weight="700">
      <g transform="translate(1084,376)"><rect width="96" height="58" rx="12" fill="#1d1a30"/><text x="48" y="30" fill="#a78bfa" font-size="22" font-weight="800" text-anchor="middle">48</text><text x="48" y="48" fill="#8b86a6" font-size="12.5" text-anchor="middle">flashcards</text></g>
      <g transform="translate(1188,376)"><rect width="96" height="58" rx="12" fill="#1d1a30"/><text x="48" y="30" fill="#a78bfa" font-size="22" font-weight="800" text-anchor="middle">12</text><text x="48" y="48" fill="#8b86a6" font-size="12.5" text-anchor="middle">quiz Qs</text></g>
      <g transform="translate(1292,376)"><rect width="96" height="58" rx="12" fill="#1d1a30"/><text x="48" y="30" fill="#a78bfa" font-size="22" font-weight="800" text-anchor="middle">1</text><text x="48" y="48" fill="#8b86a6" font-size="12.5" text-anchor="middle">timeline</text></g>
    </g>

    <!-- generate button -->
    <g transform="translate(1084,456)"><rect width="304" height="50" rx="14" fill="url(#bgv)"/><text x="152" y="32" fill="#fff" font-size="16" font-weight="800" text-anchor="middle">✦ Generate study pack</text></g>

    <!-- outputs list -->
    <text x="1084" y="548" fill="#6f6a88" font-size="13" font-weight="700" letter-spacing="1">ALSO BUILDS</text>
    <g font-size="15" fill="#c8c4dd">
      <text x="1086" y="582">📝  Cross-notebook briefing</text>
      <text x="1086" y="616">❓  FAQ from your sources</text>
      <text x="1086" y="650">🃏  Spaced-repetition deck</text>
      <text x="1086" y="684">🗓  Topic timeline</text>
    </g>

    <!-- weekly toggle -->
    <g transform="translate(1084,712)">
      <rect width="304" height="56" rx="12" fill="#191630" stroke="#2c2547"/>
      <text x="20" y="26" fill="#f3f0ff" font-size="15" font-weight="600">Refresh weekly</text>
      <text x="20" y="46" fill="#6f6a88" font-size="12.5">Rebuild when sources change</text>
      <rect x="244" y="16" width="44" height="24" rx="12" fill="#7c3aed"/><circle cx="276" cy="28" r="9" fill="#fff"/>
    </g>
    <text x="1084" y="812" fill="#6f6a88" font-size="13">Concept · not yet built. See the roadmap.</text>
  </g>
</svg>
