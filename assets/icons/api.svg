<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Programmatic API">
  <defs>
    <linearGradient id="brk" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
  </defs>
  <g fill="none" stroke="url(#brk)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="16 15 7 24 16 33">
      <animateTransform attributeName="transform" type="translate" values="0 0;-2 0;0 0" dur="2.6s" repeatCount="indefinite" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    </polyline>
    <polyline points="32 15 41 24 32 33">
      <animateTransform attributeName="transform" type="translate" values="0 0;2 0;0 0" dur="2.6s" repeatCount="indefinite" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    </polyline>
  </g>
  <line x1="27.5" y1="12" x2="20.5" y2="36" stroke="#f5d0fe" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="24" cy="40.5" r="2.3" fill="#a78bfa">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.3s" repeatCount="indefinite"/>
  </circle>
</svg>
