<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="NotebookLM Folderizer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.45" stop-color="#4c1d95"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="folderFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="folderBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#f5d0fe"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="320" fill="url(#bg)"/>

  <!-- Decorative diagonal sheen -->
  <g opacity="0.08" fill="#ffffff">
    <polygon points="0,0 360,0 140,320 0,320"/>
    <polygon points="420,0 560,0 340,320 200,320"/>
  </g>

  <!-- Decorative dotted grid -->
  <g fill="#ffffff" opacity="0.10">
    <circle cx="980" cy="60" r="3"/>
    <circle cx="1020" cy="60" r="3"/>
    <circle cx="1060" cy="60" r="3"/>
    <circle cx="980" cy="100" r="3"/>
    <circle cx="1020" cy="100" r="3"/>
    <circle cx="1060" cy="100" r="3"/>
    <circle cx="980" cy="140" r="3"/>
    <circle cx="1020" cy="140" r="3"/>
    <circle cx="1060" cy="140" r="3"/>
  </g>

  <!-- Folder + notebook motif -->
  <g transform="translate(150,96)" filter="url(#soft)">
    <!-- Back folder -->
    <path d="M10 38 q0 -16 16 -16 h70 l20 22 h120 q16 0 16 16 v96 q0 16 -16 16 H26 q-16 0 -16 -16 z" fill="url(#folderBack)"/>
    <!-- Notebook page peeking out -->
    <rect x="60" y="20" width="120" height="120" rx="8" fill="#f8fafc"/>
    <rect x="74" y="44" width="92" height="8" rx="4" fill="#a78bfa"/>
    <rect x="74" y="64" width="78" height="8" rx="4" fill="#c4b5fd"/>
    <rect x="74" y="84" width="92" height="8" rx="4" fill="#c4b5fd"/>
    <rect x="74" y="104" width="60" height="8" rx="4" fill="#ddd6fe"/>
    <!-- Front folder -->
    <path d="M10 86 q0 -10 10 -10 h220 q10 0 10 10 v74 q0 16 -16 16 H26 q-16 0 -16 -16 z" fill="url(#folderFront)"/>
    <!-- Folder tab highlight -->
    <rect x="22" y="98" width="60" height="8" rx="4" fill="#ede9fe" opacity="0.7"/>
  </g>

  <!-- Text block -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="470" y="146" fill="#ffffff" font-size="64" font-weight="800" letter-spacing="-1">NotebookLM</text>
    <text x="470" y="214" fill="url(#accent)" font-size="64" font-weight="800" letter-spacing="-1">Folderizer</text>
    <text x="474" y="256" fill="#ddd6fe" font-size="24" font-weight="500">Organize Google NotebookLM with folders, nesting &amp; drag-and-drop.</text>
  </g>

  <!-- Pill badges -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600">
    <g transform="translate(474,278)">
      <rect x="0" y="0" width="168" height="30" rx="15" fill="#ffffff" opacity="0.14"/>
      <text x="84" y="20" fill="#ffffff" text-anchor="middle">Chrome MV3 · No build</text>
    </g>
    <g transform="translate(654,278)">
      <rect x="0" y="0" width="150" height="30" rx="15" fill="#ffffff" opacity="0.14"/>
      <text x="75" y="20" fill="#ffffff" text-anchor="middle">Works standalone</text>
    </g>
  </g>
</svg>
